
services:
  kleingarten:
    image: gartenamt:${IMAGE_TAG:-1.1.1}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gartenamt
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
    volumes:
      # Mount data directory for persistent database storage
      - gartenamt-data:/data
    environment:
      - DB_PATH=/data/kleingarten.db
    restart: unless-stopped
    # Optional: add resource limits for NAS deployment
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M

volumes:
  gartenamt-data:
    driver: local
