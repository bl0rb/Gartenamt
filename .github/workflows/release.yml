name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Add MinGW to PATH (für CGO/SQLite)
        shell: bash
        run: echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Verify C compiler
        shell: bash
        run: gcc --version

      - name: Build Windows amd64
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build \
            -ldflags "-s -w -H=windowsgui -X github.com/bl0rb/gartenamt/handlers.AppVersion=${VERSION}" \
            -o "gartenamt-${VERSION}-windows-amd64.exe" .
          sha256sum "gartenamt-${VERSION}-windows-amd64.exe" > "gartenamt-${VERSION}-windows-amd64.exe.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: gartenamt-*-windows-amd64.exe*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Linux amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X github.com/bl0rb/gartenamt/handlers.AppVersion=${VERSION}" \
            -o "gartenamt-${VERSION}-linux-amd64" .
          sha256sum "gartenamt-${VERSION}-linux-amd64" > "gartenamt-${VERSION}-linux-amd64.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: gartenamt-*-linux-amd64*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Universal Binary (arm64 + x86_64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/bl0rb/gartenamt/handlers.AppVersion=${VERSION}"
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "$LDFLAGS" -o build-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -ldflags "$LDFLAGS" -o build-amd64 .
          lipo -create -output gartenamt build-arm64 build-amd64
          ARCHS=$(lipo -archs gartenamt)
          echo "Architekturen: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "❌ Universal-Binary-Check fehlgeschlagen"; exit 1 ;;
          esac

      - name: Assemble .app bundle and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="Gartenamt.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp gartenamt "$APP/Contents/MacOS/gartenamt"
          cp packaging/macos/icon.icns "$APP/Contents/Resources/icon.icns"
          sed "s/__APP_VERSION__/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          # Ad-hoc-Signatur (Pflicht auf Apple Silicon; lipo invalidiert die Build-Signatur)
          codesign --force --deep -s - "$APP"
          codesign --verify --verbose=1 "$APP"
          mkdir dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Gartenamt" -srcfolder dmg-staging -ov -format UDZO \
            "gartenamt-${VERSION}-macos-universal.dmg"
          shasum -a 256 "gartenamt-${VERSION}-macos-universal.dmg" > "gartenamt-${VERSION}-macos-universal.dmg.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: gartenamt-*-macos-universal.dmg*
          if-no-files-found: error

  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bl0rb/gartenamt:${{ steps.v.outputs.version }}
            ghcr.io/bl0rb/gartenamt:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: gartenamt-*
          generate_release_notes: true
