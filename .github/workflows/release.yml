name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Add MinGW to PATH (für CGO/SQLite)
        shell: bash
        run: echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Verify C compiler
        shell: bash
        run: gcc --version

      - name: Build Windows amd64
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build \
            -ldflags "-s -w -X kleingarten-verwaltung/handlers.AppVersion=${VERSION}" \
            -o "kleingarten-verwaltung-${VERSION}-windows-amd64.exe" .
          sha256sum "kleingarten-verwaltung-${VERSION}-windows-amd64.exe" > "kleingarten-verwaltung-${VERSION}-windows-amd64.exe.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: kleingarten-verwaltung-*-windows-amd64.exe*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Linux amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X kleingarten-verwaltung/handlers.AppVersion=${VERSION}" \
            -o "kleingarten-verwaltung-${VERSION}-linux-amd64" .
          sha256sum "kleingarten-verwaltung-${VERSION}-linux-amd64" > "kleingarten-verwaltung-${VERSION}-linux-amd64.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: kleingarten-verwaltung-*-linux-amd64*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Universal Binary (arm64 + x86_64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X kleingarten-verwaltung/handlers.AppVersion=${VERSION}"
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "$LDFLAGS" -o build-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -ldflags "$LDFLAGS" -o build-amd64 .
          lipo -create -output kleingarten-verwaltung build-arm64 build-amd64
          ARCHS=$(lipo -archs kleingarten-verwaltung)
          echo "Architekturen: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "❌ Universal-Binary-Check fehlgeschlagen"; exit 1 ;;
          esac

      - name: Assemble .app bundle and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="Kleingarten Verwaltung.app"
          mkdir -p "$APP/Contents/MacOS"
          cp kleingarten-verwaltung "$APP/Contents/MacOS/kleingarten-verwaltung"
          sed "s/__APP_VERSION__/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          # Ad-hoc-Signatur (Pflicht auf Apple Silicon; lipo invalidiert die Build-Signatur)
          codesign --force --deep -s - "$APP"
          codesign --verify --verbose=1 "$APP"
          mkdir dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Kleingarten Verwaltung" -srcfolder dmg-staging -ov -format UDZO \
            "kleingarten-verwaltung-${VERSION}-macos-universal.dmg"
          shasum -a 256 "kleingarten-verwaltung-${VERSION}-macos-universal.dmg" > "kleingarten-verwaltung-${VERSION}-macos-universal.dmg.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: kleingarten-verwaltung-*-macos-universal.dmg*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: kleingarten-verwaltung-*
          generate_release_notes: true
