version: 2
updates:
  # Go-Module (go.mod)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # GitHub-Actions-Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # Docker-Basis-Images (App)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # Docker-Basis-Image (öffentliche Webseite)
  - package-ecosystem: "docker"
    directory: "/modules/public-web"
    schedule:
      interval: "weekly"
      day: "monday"
