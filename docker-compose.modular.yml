services:
  verwaltung-app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: gartenamt:modular
    container_name: gartenamt
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/data/kleingarten.db
    volumes:
      - gartenamt-data:/data
    networks:
      - internal
    restart: unless-stopped

  public-web:
    platform: linux/amd64
    build:
      context: ./modules/public-web
      dockerfile: Dockerfile
    image: kleingarten-public-web:latest
    container_name: kleingarten-public-web
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./modules/public-web/certs:/etc/nginx/certs:ro
    networks:
      - public
    restart: unless-stopped

volumes:
  gartenamt-data:

networks:
  internal:
  public:
