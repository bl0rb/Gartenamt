<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kleingartenverein</title>
  <style>
    :root { --bg:#f6f8f3; --fg:#1f2a1f; --accent:#2d6a4f; --card:#ffffff; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; color:var(--fg); background:linear-gradient(180deg,#eef4e6, var(--bg)); }
    .wrap { max-width:960px; margin:0 auto; padding:24px; }
    .hero { background:var(--card); border-radius:14px; padding:28px; box-shadow:0 8px 24px rgba(0,0,0,.07); }
    .btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:10px 16px; border-radius:10px; }
    footer { margin-top:24px; font-size:14px; }
    footer a { color:var(--accent); margin-right:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Kleingartenverein</h1>
      <p>Willkommen auf der öffentlichen Vereinsseite. Informationen, Satzung und Kontakt finden Sie hier.</p>
      <!-- Anpassen: URL der eigenen Verwaltungs-App-Instanz eintragen
           (die Verwaltungs-App läuft separat, z.B. auf Port 8080) -->
      <a class="btn" href="https://verwaltung.verein.example.de/login">Mitglieder-Login</a>
    </section>
    <footer>
      <a href="/kontakt.html">Kontakt</a>
      <a href="/impressum.html">Impressum</a>
      <a href="/datenschutz.html">Datenschutz</a>
    </footer>
  </div>
</body>
</html>
