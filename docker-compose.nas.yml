name: gartenamt

# NAS-Deployment: zieht das fertige Image von GHCR - auf dem NAS wird nichts
# gebaut. Alle Daten liegen in ./nas-data/ neben dieser Datei und lassen sich
# so einfach mit dem NAS-Backup sichern.
#
#   1. Diese Datei in einen Ordner auf dem NAS kopieren (z.B. /volume1/docker/kleingarten)
#   2. docker compose -f docker-compose.nas.yml up -d
#   3. https://<nas-ip>:8080 öffnen (Zertifikatswarnung beim ersten Mal ist normal)
#
# Update auf eine neue Version:
#   docker compose -f docker-compose.nas.yml pull
#   docker compose -f docker-compose.nas.yml up -d
# (Datenbank-Migrationen laufen beim Start automatisch.)
#
# Die Version steht fest in KLEINGARTEN_TAG (Default unten). Ein bewegliches
# "latest" macht Updates weder reproduzierbar noch überprüfbar - für eine neue
# Version den Wert hier oder in einer .env-Datei daneben hochziehen.
#
# UMSTELLUNG AB 1.1.0: Der Container läuft nicht mehr als root. Bei einer
# bestehenden Installation einmalig auf dem NAS ausführen, sonst kann die App
# ihre Datenbank nicht mehr schreiben:
#   sudo chown -R 10001:10001 ./nas-data
# Das Zertifikat liegt jetzt unter /home/gartenamt statt /root und wird beim
# ersten Start einmalig neu erzeugt (eine Browser-Warnung).

services:
  verwaltung:
    image: ghcr.io/bl0rb/gartenamt:${KLEINGARTEN_TAG:-1.1.0}
    restart: always
    container_name: gartenamt
    # Keine zusätzlichen Kernel-Rechte, keine Rechteausweitung im Container.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/kleingarten.db
      # Hostname/IP des NAS fürs selbstsignierte TLS-Zertifikat, damit der
      # Browser-Zugriff im LAN keinen Hostname-Mismatch meldet,
      # z.B. TLS_EXTRA_HOSTS=nas.local,192.168.1.10
      TLS_EXTRA_HOSTS: ${TLS_EXTRA_HOSTS:-}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Datenbank, Backups, Exporte, App-Secret
      - ./nas-data/gartenamt:/data:rw
      # TLS-Zertifikat persistieren (sonst bei jedem Neuerstellen des
      # Containers eine neue Browser-Warnung)
      - ./nas-data/certs:/home/gartenamt/.gartenamt:rw
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
