# For running on NAS - override version with enhanced logging
version: '3.8'

services:
  kleingarten:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kleingarten-verwaltung
    ports:
      - "8080:8080"
    volumes:
      # Mount data directory for persistent database storage
      - kleingarten-data:/data
    environment:
      - DB_PATH=/data/kleingarten.db
    restart: unless-stopped
    
    # Enhanced logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "kleingarten"
    
    # Keep container running even if it crashes (for debugging)
    stdin_open: true
    tty: true

volumes:
  kleingarten-data:
    driver: local
